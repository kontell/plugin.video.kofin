[mypy]
python_version = 3.10
mypy_path = lib
files = lib, default.py, service.py, context_download_playlist.py, context_manage.py, context_play.py, context_playlist.py, context_streams.py
disallow_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
strict_equality = True

# sync and syncplay may still carry untyped signatures; their bodies are
# checked. A module listed strict below is held to full signatures.
[mypy-kofin.sync.*]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-kofin.sync.changefeed]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-kofin.sync.newcontent]
disallow_untyped_defs = True
check_untyped_defs = True

# The pipeline's leaves, its catalogue and its serializer carry full
# signatures.
[mypy-kofin.sync.backends.api.store,kofin.sync.backends.api.metadata,kofin.sync.backends.api.paths,kofin.sync.backends.api.kinds,kofin.sync.backends.api.records,kofin.sync.backends.api.walk,kofin.sync.backends.api.contract,kofin.sync.backends.api.capabilities,kofin.sync.backends.api.progress,kofin.sync.backends.api.announce,kofin.sync.backends.api.status,kofin.sync.backends.api.identity,kofin.sync.backends.api.provider,kofin.sync.backends.api.readback]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

# The catalogue, the node trees and the dynamic entries carry full signatures.
[mypy-kofin.sync.catalogue,kofin.sync.dynamic,kofin.sync.kodisetup,kofin.sync.kofindb,kofin.sync.nodes.video,kofin.sync.nodes.music,kofin.sync.nodes.props]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-kofin.syncplay.*]
disallow_untyped_defs = False
check_untyped_defs = True

# The SyncPlay modules typed so far.
[mypy-kofin.syncplay.tempo,kofin.syncplay.utils,kofin.syncplay.timesync,kofin.syncplay.ui,kofin.syncplay.providers]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

# Kodistubs has full annotations but no py.typed marker; analyze it anyway.
[mypy-xbmc,xbmcaddon,xbmcgui,xbmcplugin,xbmcvfs]
follow_untyped_imports = True

[mypy-websocket.*]
ignore_missing_imports = True
