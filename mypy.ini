[mypy]
python_version = 3.10
mypy_path = lib
files = lib, default.py, service.py, context_download_playlist.py, context_manage.py, context_play.py, context_playlist.py, context_streams.py
disallow_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
strict_equality = True

# sync and syncplay may still carry untyped signatures; their bodies are
# checked. A module listed strict below is held to full signatures.
[mypy-kofin.sync.*]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-kofin.sync.changefeed]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-kofin.sync.newcontent]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-kofin.syncplay.*]
disallow_untyped_defs = False
check_untyped_defs = True

# The SyncPlay modules typed so far.
[mypy-kofin.syncplay.tempo,kofin.syncplay.utils,kofin.syncplay.timesync,kofin.syncplay.ui,kofin.syncplay.providers,kofin.syncplay.playback]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

# Kodistubs has full annotations but no py.typed marker; analyze it anyway.
[mypy-xbmc,xbmcaddon,xbmcgui,xbmcplugin,xbmcvfs]
follow_untyped_imports = True

[mypy-websocket.*]
ignore_missing_imports = True
