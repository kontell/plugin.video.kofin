[mypy]
python_version = 3.10
mypy_path = lib
files = lib, default.py, service.py, context_download_playlist.py, context_manage.py, context_play.py, context_playlist.py, context_streams.py
disallow_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
strict_equality = True

# sync and syncplay are held to full signatures.
[mypy-kofin.sync.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-kofin.syncplay.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

# Kodistubs has full annotations but no py.typed marker; analyze it anyway.
[mypy-xbmc,xbmcaddon,xbmcgui,xbmcplugin,xbmcvfs]
follow_untyped_imports = True

[mypy-websocket.*]
ignore_missing_imports = True
