[mypy]
python_version = 3.10
mypy_path = lib
files = lib, default.py, service.py, context_play.py
disallow_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
strict_equality = True

# The sync package keeps the fork's untyped signatures (the obj-dict / spec-list
# shape, docs/sync-refactor-assessment.md §5), so signatures are not forced --
# but every function body is checked. Flipped in sync refactor phase 1: the
# only structural cost was declaring what every kodidb subclass assigns before
# Kodi.__init__ runs, and nothing rewrote a line of SQL.
[mypy-kofin.sync.*]
disallow_untyped_defs = False
check_untyped_defs = True

# New phase-5 code is not transplant: the change-feed providers and
# planners are strict (docs/phase5-implementation-plan.md §2).
[mypy-kofin.sync.changefeed]
disallow_untyped_defs = True
check_untyped_defs = True

# Same for the new-content message policy: new code, no ported semantics
# (docs/new-content-notifications-plan.md).
[mypy-kofin.sync.newcontent]
disallow_untyped_defs = True
check_untyped_defs = True

# The downloads repoint is new code beside the transplanted writers
# (docs/offline-downloads-plan.md W1.7): strict.
[mypy-kofin.sync.kodidb.downloads]
disallow_untyped_defs = True
check_untyped_defs = True

# The SyncPlay transplant gets the same treatment (phase 4, plan §2).
[mypy-kofin.syncplay.*]
disallow_untyped_defs = False
check_untyped_defs = True

# Kodistubs has full annotations but no py.typed marker; analyze it anyway.
[mypy-xbmc,xbmcaddon,xbmcgui,xbmcplugin,xbmcvfs]
follow_untyped_imports = True

[mypy-websocket.*]
ignore_missing_imports = True
