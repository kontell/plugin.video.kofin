# Prepares a published release for the official Kodi repository: its install
# zip, committed as "[plugin.video.kofin] <version>" to the
# plugin.video.kofin@piers branch of the kontell/repo-plugins fork. The pull
# request against xbmc/repo-plugins:piers is opened from that branch by hand.
# Run by hand (Actions -> Submit to Kodi -> Run workflow) with the release's
# tag, once it is published.
#
# Kodi's submitter action packs a tag with git archive, which needs
# export-ignore attributes, and those would also strip tools/ from the git
# archive exports that dev-install.sh (KOFIN_SRC) and tests/live/or_bench
# build from. So this submits the zip tools/build.py made for the release.
#
# Needs two repository secrets: GH_TOKEN, a classic token with public_repo
# scope, which updates the fork; and EMAIL, the address the submission commit
# is authored with.
name: Submit to Kodi

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to submit, e.g. v0.96.6"
        required: true
        type: string

permissions:
  contents: read

# Runs share the fork's branch, which each one force-pushes.
concurrency: submit-to-kodi

env:
  ADDON_ID: plugin.video.kofin
  KODI_REPO: repo-plugins
  KODI_BRANCH: piers

jobs:
  submit:
    name: submit
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the secrets are set
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          if [[ -z "$GH_TOKEN" || -z "$EMAIL" ]]; then
            echo "::error::Set the GH_TOKEN and EMAIL repository secrets first."
            exit 1
          fi

      - name: Fetch the release zip
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft || true)"
          if [[ "$draft" != "false" ]]; then
            echo "::error::$TAG is not a published release."
            exit 1
          fi
          # Releases from the frozen sql and api branches are for older Kodis.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TAG...$DEFAULT_BRANCH" --jq .status)"
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "::error::$TAG is not on $DEFAULT_BRANCH."
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ADDON_ID-${TAG#v}.zip" --dir release
          unzip -q "release/$ADDON_ID-${TAG#v}.zip" -d release/tree

      - name: Check the zip
        run: |
          if [[ "$(ls -A release/tree)" != "$ADDON_ID" ]]; then
            echo "::error::The zip holds more than $ADDON_ID/."
            exit 1
          fi
          version="$(python3 -c "
          import sys, xml.etree.ElementTree as ET
          print(ET.parse(sys.argv[1]).getroot().get('version'))
          " "release/tree/$ADDON_ID/addon.xml")"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::The zip is version $version, not $TAG."
            exit 1
          fi
          for dev in .github docs tests tools CLAUDE.md CONTRIBUTING.md README.md; do
            if [[ -e "release/tree/$ADDON_ID/$dev" ]]; then
              echo "::error::The zip carries $dev."
              exit 1
            fi
          done
          find "release/tree/$ADDON_ID" -type f | sort

      - name: Commit it to the fork
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          GH_USERNAME: ${{ github.actor }}
        run: |
          fork="$GH_USERNAME/$KODI_REPO"
          branch="$ADDON_ID@$KODI_BRANCH"
          # The fork's piers must hold upstream's tip: a commit made on a
          # shallow clone pushes only onto history the fork already has.
          gh repo sync "$fork" --branch "$KODI_BRANCH"
          git clone -q --depth 1 --branch "$KODI_BRANCH" \
            "https://x-access-token:$GH_TOKEN@github.com/$fork.git" fork
          cd fork
          git checkout -q -b "$branch"
          git rm -rq --ignore-unmatch "$ADDON_ID"
          cp -a "../release/tree/$ADDON_ID" .
          git add "$ADDON_ID"
          git -c user.name="$GH_USERNAME" -c user.email="$EMAIL" \
            commit -q -m "[$ADDON_ID] ${TAG#v}"
          git push -q -f origin "$branch"

